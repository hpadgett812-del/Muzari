name: Netlify Preview Build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: netlify-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Build/package-lock.json

      - name: Install dependencies
        working-directory: Build
        run: npm ci

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Build Symphonia WASM decoder
        uses: ./.github/actions/verify-wasm
        with:
          verify: "false"

      - name: Build
        working-directory: Build
        run: npm run build
        env:
          BASE_PATH: /

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-preview
          path: Build/dist/
          if-no-files-found: error
          retention-days: 3
