name: Netlify Preview Deploy

on:
  workflow_run:
    workflows: ["Netlify Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read
  issues: write

concurrency:
  group: netlify-preview-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve associated PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;

            const { data: prs } = await github.request(
              "GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls",
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                per_page: 100
              }
            );

            const matches = prs.filter(pr =>
              pr.state === "open" &&
              pr.base.ref === "main" &&
              pr.head.sha === sha
            );

            if (matches.length === 0) {
              core.info("No matching open PR for this build. Skipping.");
              core.setOutput("skip", "true");
              return;
            }

            if (matches.length !== 1) {
              throw new Error(
                `Expected one matching PR, found ${matches.length}.`
              );
            }

            const pr = matches[0];

            core.setOutput("number", String(pr.number));
            core.setOutput("head-sha", pr.head.sha);

            core.info(`Deploying preview for PR #${pr.number}`);

      - name: Download preview artifact
        if: steps.pr.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: netlify-preview
          path: ./dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview to Netlify
        if: steps.pr.outputs.skip != 'true'
        id: netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview for PR #${{ steps.pr.outputs.number }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Register GitHub deployment
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy-url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const url = process.env.DEPLOY_URL;

            // Create a deployment against the actual PR commit.
            const { data: deployment } =
              await github.rest.repos.createDeployment({
                owner,
                repo,
                ref: sha,
                task: "deploy",
                auto_merge: false,
                required_contexts: [],
                environment: "Preview - Netlify",
                description: `Preview for PR #${prNumber}`,
                transient_environment: true,
                production_environment: false
              });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: url,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: `Netlify preview deployed for PR #${prNumber}`
            });

            // Update the existing preview comment instead of spamming.
            const marker = "<!-- netlify-preview-deployment -->";
            const body =
              `${marker}\n🚀 **Netlify Preview:** ${url}\n\n` +
              `Commit: \`${sha.slice(0, 7)}\``;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100
              });

            const existing = comments.find(comment =>
              comment.body?.includes(marker) &&
              comment.user?.type === "Bot"
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

            await core.summary
              .addHeading(`PR #${prNumber} preview deployed`)
              .addLink("Open Netlify Preview", url)
              .write();
