name: Netlify Preview Deploy

on:
  workflow_run:
    workflows: ["Netlify Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: netlify-preview-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null

    runs-on: ubuntu-latest

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v5
        with:
          name: netlify-preview
          path: ${{ runner.temp }}/netlify-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact
        run: |
          set -euo pipefail

          test -d "$RUNNER_TEMP/netlify-preview"

          if find "$RUNNER_TEMP/netlify-preview" -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the preview artifact."
            exit 1
          fi

          if ! find "$RUNNER_TEMP/netlify-preview" -type f -print -quit | grep -q .; then
            echo "Preview artifact is empty."
            exit 1
          fi

      - name: Deploy preview to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ${{ runner.temp }}/netlify-preview
          production-deploy: false
          deploy-message: "GitHub Actions PR preview"
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Create GitHub deployment and PR comment
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy-url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.PR_HEAD_SHA;
            const deployUrl = process.env.DEPLOY_URL;

            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error("Invalid PR number.");
            }

            if (!/^[a-f0-9]{40}$/i.test(headSha || "")) {
              throw new Error("Invalid PR commit SHA.");
            }

            const url = new URL(deployUrl);
            if (
              url.protocol !== "https:" ||
              !url.hostname.endsWith(".netlify.app")
            ) {
              throw new Error("Unexpected Netlify deployment URL.");
            }

            // Re-check the PR against GitHub's API
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (
              pr.state !== "open" ||
              pr.base.ref !== "main" ||
              pr.head.sha !== headSha
            ) {
              throw new Error("PR is closed, targets another branch, or has changed.");
            }

            const { data: deployment } =
              await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                task: "deploy",
                auto_merge: false,
                required_contexts: [],
                environment: "netlify-preview",
                description: `Preview for PR #${prNumber}`,
                transient_environment: true,
                production_environment: false
              });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: url.href,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`,
              description: "Netlify preview deployed"
            });

            const marker = "<!-- netlify-preview -->";
            const body = [
              marker,
              "### Netlify preview",
              "",
              `[Open preview](${url.href})`,
              "",
              `Deployed commit: \`${headSha.slice(0, 7)}\``
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              }
            );

            const existing = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
